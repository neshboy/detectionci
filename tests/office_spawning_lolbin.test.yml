rule: ../rules/office_spawning_lolbin.yml
cases:
  - name: winword.exe spawning cmd.exe should match
    should_match: true
    event:
      ParentImage: C:\Program Files\Microsoft Office\root\Office16\WINWORD.exe
      Image: C:\Windows\System32\cmd.exe

  - name: excel.exe spawning powershell.exe should match
    should_match: true
    event:
      ParentImage: C:\Program Files\Microsoft Office\root\Office16\EXCEL.exe
      Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe

  - name: powerpnt.exe spawning wscript.exe should match
    should_match: true
    event:
      ParentImage: C:\Program Files\Microsoft Office\root\Office16\POWERPNT.exe
      Image: C:\Windows\System32\wscript.exe

  - name: winword.exe spawning notepad.exe should not match (not a tracked LOLBin)
    should_match: false
    event:
      ParentImage: C:\Program Files\Microsoft Office\root\Office16\WINWORD.exe
      Image: C:\Windows\System32\notepad.exe

  - name: non-office parent spawning cmd.exe should not match
    should_match: false
    event:
      ParentImage: C:\Windows\explorer.exe
      Image: C:\Windows\System32\cmd.exe
