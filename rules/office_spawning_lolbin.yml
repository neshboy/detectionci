title: Microsoft Office Application Spawning a Living-off-the-Land Binary
id: 3c7b8e2a-5d4f-4a1b-8c9e-2f6a7b8c9d10
status: experimental
description: >
  Detects a Microsoft Office application (Word/Excel/PowerPoint) spawning a
  command interpreter or scripting engine as a child process, a common
  indicator of malicious macro execution.
references:
  - https://github.com/SigmaHQ/sigma
author: DetectionCI contributors
date: 2026/09/24
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection_office_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
  selection_child_cmd:
    Image|endswith: '\cmd.exe'
  selection_child_powershell:
    Image|endswith: '\powershell.exe'
  selection_child_wscript:
    Image|endswith: '\wscript.exe'
  condition: selection_office_parent and 1 of selection_child*
falsepositives:
  - Office add-ins or macros that legitimately shell out for automation
